[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B905"]

[tool.mypy]
# numpy>=2.5 ships type stubs that use Python 3.12 grammar (PEP 695 `type`
# statements); target 3.12 so stub parsing works regardless of the runtime.
python_version = "3.12"
ignore_missing_imports = true
files = ["app", "scripts"]
